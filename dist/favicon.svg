<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E55" />
      <stop offset="100%" stop-color="#BA0C2F" />
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Crimson squircle badge -->
  <rect x="3" y="3" width="94" height="94" rx="24" fill="url(#favBg)" />
  <!-- Centered official Talvex T logo mark -->
  <g filter="url(#favShadow)">
    <image href="data:image/png;base64," x="22" y="24" width="56" height="52" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>